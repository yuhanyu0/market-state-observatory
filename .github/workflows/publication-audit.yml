name: Publication audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: python scripts/check_secret_patterns.py
      - run: python scripts/audit_publication.py
      - run: python scripts/validate_repo.py

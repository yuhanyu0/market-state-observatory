name: React build and link check

on:
  push:
    paths: ["web/**", "public/data/**", "package*.json", "vite.config.ts", "scripts/check_site_links.py"]
  pull_request:
    paths: ["web/**", "public/data/**", "package*.json", "vite.config.ts", "scripts/check_site_links.py"]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: python scripts/check_site_links.py

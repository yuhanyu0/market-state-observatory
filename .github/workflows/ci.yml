name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest
      - run: ruff check src tests scripts
      - run: mypy src
      - run: python scripts/validate_repo.py
      - run: python scripts/run_synthetic_demo.py
      - run: python scripts/audit_publication.py
      - run: python scripts/check_secret_patterns.py
      - run: python scripts/run_stream_load_test.py --messages 35000

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: python scripts/check_site_links.py
      - name: Enforce initial JavaScript budget
        run: |
          bytes=$(find dist/web/assets -name '*.js' -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          test "$bytes" -le 262144
          echo "initial_js_bytes=$bytes"

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Parse PowerShell operations scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem ops/windows,scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $failed = $true; $errors | Write-Error }
          }
          if ($failed) { exit 1 }
      - name: Windows PowerShell 5.1 compatibility tests
        shell: powershell
        run: |
          $python = (python -c "import sys; print(sys.executable)").Trim()
          .\tests\powershell\process_compat_tests.ps1 -PythonExecutable $python
          .\tests\powershell\scheduler_safety_tests.ps1
      - name: PowerShell 7 compatibility tests
        shell: pwsh
        run: |
          $python = (python -c "import sys; print(sys.executable)").Trim()
          .\tests\powershell\process_compat_tests.ps1 -PythonExecutable $python
          .\tests\powershell\scheduler_safety_tests.ps1
      - run: python -m market_state_observatory.runtime.daily_daemon --mode formal --dry-run

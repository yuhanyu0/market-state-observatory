name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest
      - run: ruff check src tests scripts
      - run: mypy src
      - run: python scripts/validate_repo.py
      - run: python scripts/run_synthetic_demo.py
      - run: python scripts/audit_publication.py
      - run: python scripts/check_secret_patterns.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python scripts/check_site_links.py
      - name: Enforce initial JavaScript budget
        run: |
          bytes=$(find dist/web/assets -name '*.js' -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          test "$bytes" -le 225280
          echo "initial_js_bytes=$bytes"

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Parse PowerShell operations scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem ops/windows,scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $failed = $true; $errors | Write-Error }
          }
          if ($failed) { exit 1 }
      - run: python -m market_state_observatory.runtime.daily_daemon --mode formal --dry-run

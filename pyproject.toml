[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "market-state-observatory"
version = "0.5.1rc1"
description = "Auditable evidence-state infrastructure for point-in-time market research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Hanyu Yu"}]
dependencies = [
  "exchange-calendars>=4.11.2,<5",
  "jsonschema>=4.22",
  "PyYAML>=6.0.2",
  "requests>=2.32",
  "tzdata>=2024.1; platform_system == 'Windows'",
  "websockets>=13.0",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0.12",
  "types-requests>=2.32",
]

[project.scripts]
mso = "market_state_observatory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_state_observatory"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src", "."]
cache_dir = ".pytest-runtime-cache"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true
show_error_codes = true
